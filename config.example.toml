# Where task data lives. Relative paths resolve against the working directory,
# so prefer absolute ones. Defaults: $XDG_DATA_HOME/bada (~/.local/share/bada).
db_path = "bada.db"
default_filter = "all"
trash_dir = "trash"

[agenda]
# How many days ahead :agenda shows in the Upcoming section.
upcoming_days = 3

[keys]
quit = "q"
add = "a"
up = "k"
down = "j"
toggle = "r"
delete = "D"
trash = "T"
detail = "v"
confirm = "enter"
cancel = "esc"
edit = "e"
rename = ""   # rename is folded into edit ("e"); no dedicated key
priority_up = "+"
priority_down = "-"
due_forward = "]"
due_back = "["
sort_due = "sd"
sort_priority = "sp"
sort_created = "st"
delete_all_done = "X"
search = "/"
note_view = "enter"
theme_toggle = "t"   # cycle through the built-in presets live (also persists)

[theme]
# preset selects a built-in palette: "light" (default), "dark", "purple",
# "ocean", "forest", "rose", or "graphite".
# Any color below overrides the preset, so you can start from a preset and tweak one hue.
# `:theme <name>` or theme_toggle ("t", cycles presets) also updates this on save.
preset = "light"
title = "#2563EB"
heading = "#0F766E"
accent = "#D97706"
muted = "#64748B"
success = "#16A34A"
warning = "#B45309"
danger = "#DC2626"
border = "#CBD5E1"
selection_bg = "#DBEAFE"
selection_fg = "#0F172A"
status_bg = "#E2E8F0"
status_fg = "#0F172A"
status_alt_bg = "#0F766E"
status_alt_fg = "#F8FAFC"
row_stripe_bg = "#F1F5F9"  # faint tint on alternating task rows ("" disables)

# --- Dark theme ----------------------------------------------------------
# The quickest way to use it is `preset = "dark"` in the [theme] block above
# (or just press "t" in the app). The explicit values below are equivalent and
# provided if you want to hand-tune individual colors.
# status_alt_bg/fg drive the framed table-header bar and the key-hint chips,
# and border drives the rounded panel frames.
#
# [theme]
# preset       = "dark"
# title        = "#8AB4F8"  # soft blue
# heading      = "#7DD3FC"  # sky
# accent       = "#F2CC60"  # warm yellow
# muted        = "#8B949E"  # readable gray
# success      = "#3FB950"  # green   (done)
# warning      = "#D29922"  # amber   (pending / recurring)
# danger       = "#F85149"  # red     (overdue)
# border       = "#30363D"  # subtle panel frames
# selection_bg = "#264F78"  # calm blue selection bar
# selection_fg = "#F0F6FC"
# status_bg    = "#161B22"
# status_fg    = "#C9D1D9"
# status_alt_bg = "#21262D" # neutral header bar / key chips
# status_alt_fg = "#F0F6FC"
# holiday_bg   = "#3D1722"  # subdued red tint
# row_stripe_bg = "#11161D" # faint tint on alternating task rows

# --- Purple theme --------------------------------------------------------
# A violet-forward dark palette. Use `preset = "purple"` in the [theme] block
# above, or copy these values if you want to hand-tune individual colors.
#
# [theme]
# preset       = "purple"
# title        = "#C4B5FD"  # lavender
# heading      = "#DDD6FE"  # pale violet
# accent       = "#F0ABFC"  # orchid
# muted        = "#A1A1AA"  # soft gray
# success      = "#34D399"  # mint    (done)
# warning      = "#FBBF24"  # amber   (pending / recurring)
# danger       = "#FB7185"  # rose    (overdue)
# border       = "#4C1D95"  # deep violet frames
# selection_bg = "#6D28D9"  # violet selection bar
# selection_fg = "#FAF5FF"
# status_bg    = "#1E1B2E"
# status_fg    = "#E9D5FF"
# status_alt_bg = "#2E1065" # purple header bar / key chips
# status_alt_fg = "#F5F3FF"
# holiday_bg   = "#4C1230"  # subdued rose tint
# row_stripe_bg = "#211A33" # faint tint on alternating task rows

